name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      X_CLIENT_ID: stimgraph-inert-test
      X_CLIENT_SECRET: stimgraph-inert-test-secret
      X_REDIRECT_URI: http://127.0.0.1:3001/api/auth/x/callback
      XAI_API_KEY: ''
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reject tracked local credentials
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { basename } = require('node:path');
          const tracked = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const forbidden = tracked.filter((file) => {
            const name = basename(file);
            return (name === '.env' || name.startsWith('.env.')) && name !== '.env.example'
              || name === '.dev.vars' || name.startsWith('.dev.vars.');
          });
          if (forbidden.length) {
            console.error('Local credential files must not be tracked:', forbidden.join(', '));
            process.exit(1);
          }
          NODE
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Build
        run: pnpm build
