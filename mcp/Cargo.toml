[package]
name = "stimgraph-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Read-only Stimgraph bookmark search for the official Rust MCP SDK"

[dependencies]
rmcp = { version = "=3.9.0", features = [
  "server",
  "transport-streamable-http-server",
] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.1", features = ["bundled", "hooks"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = "=1.9.1"
schemars = "=1.2.3"

[dev-dependencies]
tempfile = "=3.27.0"
rmcp = { version = "=3.9.0", features = [
  "client",
  "transport-streamable-http-client-reqwest",
] }
